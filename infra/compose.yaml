services:
  metering:
    build:
      context: ../..
      dockerfile: infra/image/Containerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://metering:metering@postgres:5432/metering?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
