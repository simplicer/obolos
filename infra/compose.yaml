services:
  obolos:
    build:
      context: ../..
      dockerfile: infra/image/Containerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://obolos:obolos@postgres:5432/obolos?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: obolos
      POSTGRES_PASSWORD: obolos
      POSTGRES_DB: obolos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obolos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
